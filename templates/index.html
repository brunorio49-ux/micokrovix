<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Micokrovix — Gestão Inteligente de Fretes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0C0F; --bg2: #111418; --bg3: #181C22; --bg4: #1E232B;
    --border: rgba(255,255,255,0.07); --border2: rgba(255,255,255,0.12);
    --text: #F0F2F5; --text2: #8A9BB0; --text3: #4A5568;
    --green: #00E577; --green2: #00B85E; --green-dim: rgba(0,229,119,0.12);
    --red: #FF4D4D; --red-dim: rgba(255,77,77,0.12);
    --amber: #FFB800; --amber-dim: rgba(255,184,0,0.12);
    --blue: #3B82F6; --blue-dim: rgba(59,130,246,0.12);
    --radius: 14px; --radius-sm: 8px;
    --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    --shadow: 0 2px 20px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #F8FAFC; --bg2: #FFFFFF; --bg3: #F1F5F9; --bg4: #E2E8F0;
    --border: rgba(0,0,0,0.08); --border2: rgba(0,0,0,0.15);
    --text: #1E293B; --text2: #475569; --text3: #94A3B8;
    --green-dim: rgba(0,180,90,0.10);
    --red-dim: rgba(220,50,50,0.10);
    --amber-dim: rgba(200,140,0,0.10);
    --blue-dim: rgba(59,130,246,0.10);
    --shadow: 0 2px 20px rgba(0,0,0,0.08);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

  .sidebar { width: 240px; flex-shrink: 0; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; transition: transform 0.3s; }
  .main { margin-left: 240px; flex: 1; min-height: 100vh; }

  .logo-wrap { padding: 24px 20px 20px; border-bottom: 1px solid var(--border); }
  .logo { font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
  .logo span { color: var(--green); }
  .logo-sub { font-size: 10px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; margin-top: 2px; }
  .nav { padding: 16px 12px; flex: 1; }
  .nav-label { font-size: 10px; color: var(--text3); letter-spacing: 2px; text-transform: uppercase; padding: 0 8px; margin-bottom: 8px; margin-top: 16px; }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-size: 14px; font-weight: 500; transition: all 0.15s; margin-bottom: 2px; border: none; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--bg3); color: var(--text); }
  .nav-item.active { background: var(--green-dim); color: var(--green); }
  .nav-icon { font-size: 16px; width: 20px; text-align: center; }
  .sidebar-footer { padding: 16px; border-top: 1px solid var(--border); }
  .version-badge { font-size: 11px; color: var(--text3); text-align: center; }

  .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 32px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 50; }
  .page-title { font-family: var(--font-head); font-size: 18px; font-weight: 700; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .hamburger { display: none; background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; }
  .theme-btn { background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; font-size: 16px; color: var(--text); }

  .page { display: none; padding: 32px; }
  .page.active { display: block; }

  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
  
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 12px; color: var(--text2); font-weight: 500; margin-bottom: 6px; display: block; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border2); border-radius: var(--radius-sm); padding: 11px 14px; color: var(--text); font-size: 15px; outline: none; }
  .form-input:focus { border-color: var(--green); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; cursor: pointer; border: none; width: 100%; }
  .btn-primary { background: var(--green); color: #000; box-shadow: 0 0 20px rgba(0,229,119,0.25); }
  .btn-primary:hover { background: var(--green2); }

  /* Estilo da caixa de resultado que conversa com o app.py */
  .resultado { background: linear-gradient(135deg,#1e293b,#0f172a); color: white; border-radius: var(--radius); padding: 24px; margin-top: 24px; border: 1px solid rgba(255,255,255,0.1); }
  .linha { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.08); font-size: 14px; }
  .lucro-positivo { color: #4ade80; font-weight: bold; }
  .lucro-negativo { color: #f87171; font-weight: bold; }

  .history-item { background: var(--bg3); padding: 14px; margin-bottom: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border); }
  
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .hamburger { display: block; }
    .grid2 { grid-template-columns: 1fr; }
    .form-row { grid-template-columns: 1fr; }
    .page { padding: 16px; }
  }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
  <div class="logo-wrap">
    <div class="logo">Mico<span>krovix</span></div>
    <div class="logo-sub">Pra quem vive da estrada</div>
  </div>
  <div class="nav">
    <div class="nav-label">Menu</div>
    <button class="nav-item active" onclick="showPage('calcular')"><span class="nav-icon">🧮</span> Calcular Frete</button>
    <button class="nav-item" onclick="showPage('historico'); carregarHistorico();"><span class="nav-icon">📜</span> Histórico</button>
  </div>
  <div class="sidebar-footer">
    <div class="version-badge">Micokrovix Engine v2.0</div>
  </div>
</div>

<main class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:14px">
      <button class="hamburger" onclick="toggleSidebar()">☰</button>
      <div class="page-title" id="topbar-title">Calculadora de Frete</div>
    </div>
    <div class="topbar-right">
      <button class="theme-btn" onclick="toggleTheme()" id="theme-btn">🌙</button>
    </div>
  </div>

  <!-- PÁGINA DE CÁLCULO -->
  <div class="page active" id="page-calcular">
    <div class="grid2">
      <div class="card">
        <h2 style="font-family:var(--font-head);margin-bottom:16px;color:var(--text);">🚛 Novo Cálculo</h2>
        
        <div class="form-row">
          <div class="form-group"><label class="form-label">📍 Origem</label><input class="form-input" id="origem" placeholder="Ex: São Paulo"></div>
          <div class="form-group"><label class="form-label">🎯 Destino</label><input class="form-input" id="destino" placeholder="Ex: Rio de Janeiro"></div>
        </div>
        
        <div class="form-row">
          <div class="form-group"><label class="form-label">💰 Valor do Frete (R$)</label><input class="form-input" id="valor_frete" type="number" placeholder="1800" step="0.01"></div>
          <div class="form-group"><label class="form-label">🛣️ Distância (km - opcional)</label><input class="form-input" id="distancia" type="number" placeholder="Automático se vazio"></div>
        </div>

        <div class="form-row">
          <div class="form-group"><label class="form-label">⛽ Preço Diesel (R$/L)</label><input class="form-input" id="preco_diesel" type="number" value="6.09" step="0.01"></div>
          <div class="form-group"><label class="form-label">📊 Consumo (km/L)</label><input class="form-input" id="consumo" type="number" value="3.0" step="0.1"></div>
        </div>

        <div class="form-group"><label class="form-label">🛣️ Pedágio Manual (R$ - opcional)</label><input class="form-input" id="pedagio" type="number" value="0" step="0.01"></div>
        
        <button class="btn btn-primary" onclick="calcularFrete()">⚡ CALCULAR VIAGEM</button>
      </div>

      <div>
        <div id="resultado">
          <div class="card" style="text-align:center;padding:40px 20px;color:var(--text3);">
            <div style="font-size:36px;margin-bottom:10px">📊</div>
            <div>Preencha os dados ao lado para ver a viabilidade do frete, pedágio automático e margem de lucro.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- PÁGINA DE HISTÓRICO -->
  <div class="page" id="page-historico">
    <div class="card">
      <h2 style="font-family:var(--font-head);margin-bottom:16px;">📜 Viagens Anteriores</h2>
      <div id="historico-lista">
        <div style="color:var(--text3);text-align:center;padding:20px;">Carregando histórico...</div>
      </div>
    </div>
  </div>
</main>

<script>
function toggleTheme() {
  const html = document.documentElement;
  const isLight = html.getAttribute('data-theme') === 'light';
  html.setAttribute('data-theme', isLight ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = isLight ? '🌙' : '☀️';
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}

// Comunicação direta com o seu app.py via API Flask
async function calcularFrete() {
  const btn = event.target;
  const originalText = btn.textContent;
  btn.textContent = '⏳ Calculando rota e pedágios...';
  btn.disabled = true;

  try {
    const payload = {
      origem: document.getElementById('origem').value,
      destino: document.getElementById('destino').value,
      distancia: document.getElementById('distancia').value || 0,
      valor_frete: document.getElementById('valor_frete').value,
      preco_diesel: document.getElementById('preco_diesel').value,
      consumo: document.getElementById('consumo').value,
      pedagio: document.getElementById('pedagio').value
    };

    const res = await fetch('/api/calculate', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    
    const r = await res.json();
    
    document.getElementById('resultado').innerHTML = `
      <div class="resultado">
        <div style="font-family:var(--font-head);font-size:18px;font-weight:700;margin-bottom:12px">${r.status}</div>
        <div style="font-size:13px;color:#cbd5e1;margin-bottom:16px">💡 ${r.mensagem}</div>
        <div class="linha"><span>📏 Distância estimada:</span><span><strong>${r.distancia} km</strong></span></div>
        <div class="linha"><span>🛣️ Rota / Pedágio (${r.rodovia}):</span><span>R$ ${r.pedagio.toFixed(2)}</span></div>
        <div class="linha"><span>⛽ Combustível:</span><span>R$ ${r.combustivel.toFixed(2)}</span></div>
        <div class="linha"><span>🔧 Manutenção:</span><span>R$ ${r.manutencao.toFixed(2)}</span></div>
        <div class="linha"><span>💰 Custo Total:</span><span><strong>R$ ${r.custo_total.toFixed(2)}</strong></span></div>
        <div class="linha"><span>💵 LUCRO LÍQUIDO:</span><span class="${r.lucro >= 0 ? 'lucro-positivo' : 'lucro-negativo'}">R$ ${r.lucro.toFixed(2)}</span></div>
        <div class="linha"><span>📈 Margem de Lucro:</span><span><strong>${r.margem}%</strong></span></div>
      </div>
    `;
  } catch (err) {
    document.getElementById('resultado').innerHTML = '<div class="card" style="color:var(--red)">❌ Erro ao processar o cálculo com o servidor.</div>';
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

async function carregarHistorico() {
  try {
    const res = await fetch('/api/history');
    const viagens = await res.json();
    const wrap = document.getElementById('historico-lista');
    
    if (viagens.length === 0) {
      wrap.innerHTML = '<div style="color:var(--text3);text-align:center;padding:20px;">Nenhuma viagem salva ainda.</div>';
      return;
    }

    let html = '';
    for (const v of viagens) {
      html += `
        <div class="history-item">
          <div style="font-weight:700">${v.origem || '?'} → ${v.destino || '?'}</div>
          <div style="font-size:13px;color:var(--text2);margin-top:4px">📏 ${v.distancia} km | 🛣️ Rodovia: ${v.rodovia}</div>
          <div style="margin-top:6px;font-weight:bold;color:${v.lucro >= 0 ? 'var(--green)' : 'var(--red)'}">Lucro: R$ ${v.lucro.toFixed(2)} (${v.margem}%)</div>
        </div>
      `;
    }
    wrap.innerHTML = html;
  } catch(e) {
    document.getElementById('historico-lista').innerHTML = '<div style="color:var(--red)">Erro ao carregar histórico do banco.</div>';
  }
}
</script>
</body>
</html>
